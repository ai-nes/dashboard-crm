/* ---------------- dựng cartogram ---------------- */
const allPen = REGIONS.flatMap(([, ps]) => ps.map(p => p[1]));
const pmin = Math.min(...allPen), pmax = Math.max(...allPen);
const stepOf = v => 'q' + (1 + Math.min(6, Math.max(0, Math.round(((v - pmin) / (pmax - pmin)) * 6))));
document.getElementById('carto').innerHTML = REGIONS.map(([r, ps]) => `
  <div class="carto__region">
    <div class="carto__rlabel">${r}</div>
    <div class="carto__tiles">${ps.map(([n, pen, enr]) => {
      const s = stepOf(pen);
      return `<div class="tile qt${s.slice(1)}"
        data-tip="<b>${n}</b><br>Penetration ${pen.toFixed(1).replace('.', ',')}%<br>Nhập học ${fmt(enr)}">
        <b>${n}</b><span>${pen.toFixed(1).replace('.', ',')}%</span></div>`;
    }).join('')}</div>
  </div>`).join('');
